run_title: 'model'

training_model:
  kind: default
  visualize_each_iters: 500
  concat_mask: true
  store_discr_outputs_for_vis: true
losses:
  l1:
    weight_missing: 0
    weight_known: 10
  perceptual:
    weight: 0
  adversarial:
    kind: r1
    weight: 10
    gp_coef: 0.001
    mask_as_fake_target: False
    allow_scale_mask: False
  feature_matching:
    weight: 100
  resnet_pl:
    weight: 30
    weights_path: E:\retarget/

defaults:
  - location: bird
  - data: abl-04-256-mh-dist
  - generator: ffc_resnet_075
  - discriminator: pix2pixhd_nlayer
  - optimizers: default_optimizers
  - visualizer: directory
  - evaluator: default_inpainted
  - trainer: any_gpu_large_ssim_ddp_final_celeba
  - hydra: overrides